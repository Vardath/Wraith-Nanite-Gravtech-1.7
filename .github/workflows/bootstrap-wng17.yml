name: Bootstrap WNG 1.7 from validated 1.6
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  copy:
    if: github.event.head_commit.message == 'Initialize WNG 1.7 port bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone current 1.6 release source and preserve compatible binaries
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/Vardath/Wraith-Nanite-Gravtech-1.6.git /tmp/wng-16
          rsync -a --exclude='.git' --exclude='.github/workflows' /tmp/wng-16/ ./
          mkdir -p 1.6/Assemblies 1.7/Assemblies
          mv Assemblies/WraithNaniteGravtech.dll 1.6/Assemblies/
          mv Assemblies/WraithNaniteGravtech.buildinfo.json 1.6/Assemblies/
          if [ -f Assemblies/WraithNaniteGravtech.pdb ]; then
            mv Assemblies/WraithNaniteGravtech.pdb 1.6/Assemblies/
          fi
          rmdir Assemblies
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          # Shared content is loaded from root, but the managed DLL is loaded
          # only from the selected game version's Assemblies directory.
          Path("LoadFolders.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <loadFolders>
            <v1.6>
              <li>/</li>
              <li>1.6</li>
              <li IfModActive="CETeam.CombatExtended">Compatibility/CombatExtended</li>
            </v1.6>
            <v1.7>
              <li>/</li>
              <li>1.7</li>
              <li IfModActive="CETeam.CombatExtended">Compatibility/CombatExtended</li>
            </v1.7>
          </loadFolders>
          ''',encoding="utf-8")
          meta=Path("About/About.xml")
          s=meta.read_text(encoding="utf-8")
          s=s.replace("<li>1.6</li>","<li>1.6</li>\n    <li>1.7</li>",1)
          s=s.replace("RimWorld 1.6 expansion", "RimWorld 1.6 / 1.7 (1.7 unstable beta) expansion")
          s=s.replace("Includes four Wraith/human-form player starts", "Includes seven Wraith/human-form player starts")
          meta.write_text(s,encoding="utf-8")
          ET.parse("About/About.xml")
          cs=Path("Source/WraithNaniteGravtech/WraithNaniteGravtech.csproj")
          s=cs.read_text(encoding="utf-8")
          for old,new in [
              ("<TargetFramework>net472</TargetFramework>","<TargetFramework>net10.0</TargetFramework>"),
              ("<OutputPath>../../Assemblies/</OutputPath>","<OutputPath>../../1.7/Assemblies/</OutputPath>"),
              ('Krafs.Rimworld.Ref" Version="1.6.4871"','Krafs.Rimworld.Ref" Version="1.7.4977-alpha.1"'),
              ('Lib.Harmony" Version="2.3.3"','Lib.Harmony" Version="3.0.0-rc.2"')
          ]:
              if old not in s: raise SystemExit("Missing source csproj anchor: "+old)
              s=s.replace(old,new,1)
          s=s.replace('    <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies.net472" Version="1.0.3" PrivateAssets="all" />\n',"")
          s=s.replace("<DebugType>portable</DebugType>","<DebugType>portable</DebugType>\n    <GenerateDependencyFile>false</GenerateDependencyFile>")
          cs.write_text(s,encoding="utf-8")
          # Preserve old code and tests, but not the separate 1.6-only CI
          # workflows, which compile net472 and would publish wrong assemblies.
          Path(".github/workflows/bootstrap-wng17.yml").unlink()
          Path("PORTING-1.7.md").write_text(
              "# WNG 1.6 / 1.7 Waylith port\n\n"
              "Source: Vardath/Wraith-Nanite-Gravtech-1.6 main, snapshot copied by bootstrap workflow.\n"
              "Common Defs, Patches, Textures, Sounds and optional CE patches load from mod root.\n"
              "The 1.6 and 1.7 Assemblies directories are mutually exclusive in LoadFolders.xml.\n"
              "1.6 assembly is preserved byte-for-byte from the source repository.\n"
              "1.7 source targets net10.0, Krafs.Rimworld.Ref 1.7.4977-alpha.1, "
              "and Lib.Harmony 3.0.0-rc.2.\n"
              "Experimental 1.7 compatibility: requires Waylith runtime testing and "
              "dependency verification before Workshop signoff.\n"
              "Z Adaptive companion inside the repository is preserved as 1.6 source "
              "and has NOT been ported to 1.7.\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Port complete WNG 1.6 source to dual-version 1.6 and 1.7 layout"
          git push origin HEAD:main
